[project]
name = "upflow"
version = "0.33.0"
description = "Modern AI upscaling + frame interpolation for AMD GPUs — Vulkan-native, FastAPI, web UI + REST API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "jinja2>=3.1.4,<4.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "pillow>=10.4.0,<11.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  # SP8 - update_service.py compares release tags with packaging.version.Version.
  # Declared explicitly: it was only reaching the env transitively, which a
  # fresh embedded-Python install can't be relied on to reproduce.
  "packaging>=23.0",
  "aiofiles>=24.1.0,<25.0.0",
  # Task 3 amendment (2026-07-24) - password hashing switched from
  # hashlib.scrypt (N=2^14) to argon2id after an automated security review
  # flagged the scrypt cost parameter as weak by current OWASP standards.
  # Approved exception to this project's zero-new-dependencies default.
  "argon2-cffi>=23.1.0,<24.0.0",
  # Generacion de voz (Kokoro): el modelo no recibe texto sino FONEMAS IPA, y
  # estas dos traen el paso texto->fonemas. `espeakng-loader` empaqueta la DLL y
  # los datos de espeak-ng como wheel, asi que el usuario no instala nada aparte.
  "espeakng-loader>=0.2.4",
  "phonemizer-fork>=3.3.2",
  "httpx>=0.27.0,<1.0.0",
  # Motor del apartado de descargas: github.com/santiquiroz/fetchflow, nuestro.
  # Ahi vive TODA la logica de descarga y ahi se hacen los ajustes; Upflow solo la
  # consume. Arrastra yt-dlp y curl-cffi como dependencias suyas, asi que no se
  # declaran aca -- declararlas dos veces es como las dos copias se desincronizan.
  #
  # SIN url git+ a proposito: eso exigiria el binario git en la maquina del usuario
  # final, y el `pip install -e .` del primer arranque fallaria ENTERO, no solo para
  # quien use descargas. El instalador vendoriza la wheel (ver package-release.ps1).
  "fetchflow>=0.2.1",
  "numpy>=1.26.0,<3.0.0",
  # Piso 1.24 y no 1.19: la API de plugin EP (register_execution_provider_library,
  # SessionOptions.add_provider_for_devices) no existe antes, y sin ella los
  # aceleradores nativos de NVIDIA e Intel no se pueden registrar. 1.24.4 es el
  # ultimo publicado de onnxruntime-directml.
  "onnxruntime-directml>=1.24.0,<2.0.0; sys_platform == 'win32'",
  # SP1 Task 6 - .pth/.safetensors -> ONNX conversion (app/services/model_converter.py).
  # torch is unpinned to a CUDA index on purpose: plain PyPI already resolves
  # to a CPU-capable wheel and this only ever runs the export/inference
  # graph on CPU. `onnx` (the protobuf graph library, distinct from
  # `onnxruntime`) is a transitive hard requirement of torch.onnx.export
  # itself, not something this module calls directly.
  "torch>=2.2.0,<3.0.0",
  "spandrel>=0.4.0,<1.0.0",
  "onnx>=1.16.0,<2.0.0",
  # SP9 - Apollo audio restore (app/services/engines/apollo_restore.py) reads
  # audio via soundfile and resamples to 44.1k via scipy.signal.resample_poly.
  "soundfile>=0.12.0,<1.0.0",
  "scipy>=1.11.0,<2.0.0",
  # SP11 - motor ONNX de video (onnx_video_upscaler.py) usa cv2.imread/imwrite
  # para I/O de frames PNG: mucho mas rapido que PIL (PIL era el cuello,
  # ~3.15s/frame en 5K). headless = sin deps de GUI, ~40MB.
  "opencv-python-headless>=4.10.0,<5.0.0",
  # Task 4 - GenerationEngine (app/services/engines/generation_onnx.py) usa
  # optimum.onnxruntime.ORTStableDiffusionPipeline. Pins exactos del spike
  # (docs/superpowers/specs/2026-07-22-optimum-spike-findings.md): NUNCA el
  # extra `optimum[onnxruntime]` -- arrastra `onnxruntime` vanilla que pisa
  # `onnxruntime-directml`. optimum==2.2.0 es incompatible con
  # optimum-onnx==0.1.0 (exige optimum~=2.1.0); transformers>=4.58 rompe
  # optimum-onnx (exige transformers<4.58,>=4.36) -- ambos verificados con
  # `pip check` en el spike.
  "optimum==2.1.0",
  "optimum-onnx==0.1.0",
  "transformers>=4.36,<4.58",
  # Tokenizer T5 de SD3.5 y Flux. Sin esto el install de esas dos
  # arquitecturas muere con "Cannot instantiate this tokenizer from a slow
  # version. If it's based on sentencepiece, make sure you have sentencepiece
  # installed" (reportado 2026-07-29 con un repo Flux real).
  "sentencepiece>=0.2.0,<1.0.0",
  "diffusers>=0.30,<1.0",
  # Subproyecto B (admision por capacidad, ver docs/superpowers/specs/
  # 2026-07-24-gpu-capacity-admission-design.md) - RAM libre real para
  # SystemRamProbe (app/services/resource_probes.py), jobs en cpu.
  "psutil>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0"
]
# GMFSS OpenCL GPU splat (app/services/engines/gmfss/softsplat_cl.py). Optional:
# the softmax splat step falls back to the CPU reference (softsplat.py)
# automatically, with a one-time warning, if this is not installed or no
# working OpenCL GPU is found. Same pin as port-gmfss-onnx's
# toolkit/requirements-gpu-splat.txt, the upstream driver this module vendors.
gpu-splat = [
  "pyopencl==2026.1.2"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
